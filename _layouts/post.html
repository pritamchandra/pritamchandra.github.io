---
layout: default
---
<div class="cluster" style="padding-top: 2.6rem;">
  <main class="prose" style="max-width: var(--content-width); margin: 0 auto;" id="main">

    <header class="entry-head">
      <h1>{{ page.title }}</h1>
      <p class="entry-meta">{{ page.date | date: "%-d %B %Y" }}</p>
      <div class="tags">{% for t in page.tags %}<a class="tag" href="{{ t | slugify | prepend: '/blog/tag/' | append: '/' | relative_url }}">{{ t }}</a>{% endfor %}</div>
      <hr class="rule" style="margin-top:1em;">
    </header>

    {{ content }}

    {% include footer.html %}
  </main>
</div>
